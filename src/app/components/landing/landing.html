<nav class="navbar">
  <span class="logo">🦖 DINO RUNNER</span>
  <div class="nav-icons">
    <button class="icon-btn" (click)="language.toggle()">{{ language.lang() === 'en' ? '🌐 EN' : '🌐 FR' }}</button>
    <button class="icon-btn" (click)="sound.toggleMute()">{{ sound.muted ? '🔇' : '🔊' }}</button>
    <span class="guest-badge">{{ username || 'Guest' }}</span>
  </div>
</nav>

<section class="hero">
  <div class="hero-text">
    <h1 class="game-title">{{ t('title') }}</h1>
    <p class="tagline">{{ t('tagline') }}</p>
    <div class="hero-actions">
      <button class="btn-primary full-width" (click)="onStartGame()">{{ t('start') }}</button>
      <button class="btn-secondary full-width" (click)="onLeaderboard()">{{ t('leaderboard') }}</button>
      <button class="btn-ghost full-width" (click)="toggleHowToPlay()">{{ t('howTo') }}</button>
      <a class="btn-ghost full-width login-link" routerLink="/auth">{{ t('login') }}</a>
    </div>
  </div>
</section>

@if (showHowToPlay) {
  <div class="modal-overlay" (click)="toggleHowToPlay()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h2>{{ t('howToTitle') }}</h2>
      <ul>
        <li>{{ t('rule1') }}</li>
        <li>{{ t('rule2') }}</li>
        <li>{{ t('rule3') }}</li>
        <li>{{ t('rule4') }}</li>
        <li>{{ t('rule5') }}</li>
      </ul>
      <button class="btn-primary full-width" (click)="toggleHowToPlay()">{{ t('gotIt') }}</button>
    </div>
  </div>
}
