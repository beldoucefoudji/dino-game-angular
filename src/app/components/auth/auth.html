<div class="auth-page">
  <a class="back-btn" routerLink="/">
    <i class="bi bi-arrow-left"></i>
  </a>

  <div class="lang-sound-row">
    <button class="icon-btn" (click)="language.toggle()">
      <i class="bi bi-globe"></i> {{ language.lang() === 'en' ? 'EN' : 'FR' }}
    </button>
    <button class="icon-btn" (click)="sound.toggleMute()">
      <i class="bi" [class.bi-volume-mute-fill]="sound.muted" [class.bi-volume-up-fill]="!sound.muted"></i>
    </button>
  </div>

  <header class="auth-header">
    <div class="title-stack">
      <div class="pixel-title">
        <span class="word dino">DINO</span>
        <span class="word runner">RUNNER</span>
      </div>
      <div class="tagline">RACE • JUMP • SURVIVE</div>
    </div>
  </header>

  <div class="auth-card">
    <h2>WELCOME BACK, RUNNER!</h2>

    <div class="auth-tabs">
      <button class="tab" [class.active]="mode === 'login'" (click)="switchMode('login')">{{ t('login') }}</button>
      <button class="tab" [class.active]="mode === 'signup'" (click)="switchMode('signup')">{{ t('signup') }}</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <label>
        <i class="bi bi-envelope-fill"></i> Email Address
      </label>
      <input type="email" [(ngModel)]="email" name="email" required />

      <label>
        <i class="bi bi-lock-fill"></i> Password
      </label>
      <div class="password-wrap">
        <input type="password" [(ngModel)]="password" name="password" required />
        <span class="eye">
          <i class="bi bi-eye"></i>
        </span>
      </div>

      @if (mode === 'login') {
        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="keepSignedIn" name="keepSignedIn" />
            Remember me
          </label>
          <a href="#">Forgot Password?</a>
        </div>
      }

      @if (errorMessage) {
        <p class="error-text">{{ errorMessage }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? '...' : (mode === 'login' ? t('submitLogin') : t('submitSignup')) }}
      </button>
    </form>

    <div class="divider"><span>OR CONTINUE WITH</span></div>

    <div class="oauth-row">
      <button class="oauth-btn google" type="button">
        <i class="bi bi-google"></i> Google
      </button>
      <button class="oauth-btn discord" type="button">
        <i class="bi bi-discord"></i> Discord
      </button>
    </div>

    <p class="switch-note">
      Don't have an account? <a (click)="switchMode('signup')">Sign up</a>
    </p>
  </div>

  <button class="home-btn" routerLink="/" type="button">
    <i class="bi bi-arrow-left"></i> BACK TO HOME
  </button>
</div>
