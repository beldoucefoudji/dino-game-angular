<div class="game-page">
  <div class="canvas-wrap">
    <canvas #gameCanvas width="1100" height="500" [attr.aria-label]="language.t('gameCanvas')">{{ language.t('gameCanvas') }}</canvas>

    <button class="back-btn" [attr.aria-label]="language.t('back')" (click)="onExit()">
      <i class="bi bi-arrow-left"></i>
    </button>

    <div class="top-left-icons">
      <button class="icon-btn round" [attr.aria-label]="language.t('changeLanguage')" (click)="language.toggle()">
        <i class="bi bi-globe"></i>
      </button>
      <button class="icon-btn round" [attr.aria-label]="language.t(sound.muted ? 'unmute' : 'mute')" [attr.aria-pressed]="sound.muted" (click)="sound.toggleMute()">
        <i class="bi" [class.bi-volume-mute-fill]="sound.muted" [class.bi-volume-up-fill]="!sound.muted"></i>
      </button>
    </div>

    <div class="player-card">
      <span class="avatar">
        <i class="bi bi-person-fill"></i>
      </span>
      <div>
        <p class="player-name">{{ username }}</p>
        <div class="hearts">
          @for (i of [1,2,3]; track i) {
            <span [class.dim]="i > lives">
              <i class="bi" [class.bi-heart-fill]="i <= lives" [class.bi-heart]="i > lives"></i>
            </span>
          }
        </div>
      </div>
    </div>

    <div class="score-panel">
      <p class="score-label">{{ language.t('score') }}</p>
      <p class="score-value">{{ Math.floor(score) }}</p>
      <p class="best-value">{{ language.t('best') }}: {{ Math.floor(highScore) }}</p>
    </div>

    <div class="top-right">
      <div class="coin-badge">
        <i class="bi bi-coin"></i> {{ coins }}
      </div>
      <button class="icon-btn round" [attr.aria-label]="language.t(isPaused ? 'resume' : 'pause')" (click)="togglePause()">
        <i class="bi" [class.bi-play-fill]="isPaused" [class.bi-pause-fill]="!isPaused"></i>
      </button>
    </div>

    <div class="speed-panel">
      <p class="speed-label">{{ language.t('speed') }}</p>
      <div class="speed-bar">
        @for (i of [1,2,3,4,5]; track i) {
          <span class="speed-seg" [class.filled]="i <= speedTier"></span>
        }
      </div>
    </div>

    <div class="distance-wrap">
      <span class="distance-label">{{ Math.floor(distance) }} M</span>
    </div>

    <button class="touch-btn jump-btn" (pointerdown)="captureControl($event, 'jump')" (pointerup)="releaseJump()" (pointercancel)="releaseJump()" (lostpointercapture)="releaseJump()" (keydown.enter)="pressJump()" (keyup.enter)="releaseJump()" (keydown.space)="$event.preventDefault(); pressJump()" (keyup.space)="releaseJump()" (blur)="releaseJump()">
      <span><i class="bi bi-arrow-up-circle-fill"></i></span><small>{{ language.t('jump') }}</small>
    </button>
    <button class="touch-btn duck-btn" (pointerdown)="captureControl($event, 'duck')" (pointerup)="releaseDuck()" (pointercancel)="releaseDuck()" (lostpointercapture)="releaseDuck()" (keydown.enter)="pressDuck()" (keyup.enter)="releaseDuck()" (keydown.space)="$event.preventDefault(); pressDuck()" (keyup.space)="releaseDuck()" (blur)="releaseDuck()">
      <span><i class="bi bi-arrow-down-circle-fill"></i></span><small>{{ language.t('duck') }}</small>
    </button>
  </div>
</div>
