<div class="game-page">
  <div class="canvas-wrap">
    <canvas #gameCanvas width="1100" height="500"></canvas>

    <button class="back-btn" (click)="onExit()">←</button>

    <div class="top-left-icons">
      <button class="icon-btn round" (click)="language.toggle()">{{ language.lang() === 'en' ? '🌐' : '🌐' }}</button>
      <button class="icon-btn round" (click)="sound.toggleMute()">{{ sound.muted ? '🔇' : '🔊' }}</button>
    </div>

    <div class="player-card">
      <span class="avatar">🦖</span>
      <div>
        <p class="player-name">{{ username }}</p>
        <div class="hearts">
          @for (i of [1,2,3]; track i) {
            <span [class.dim]="i > lives">❤</span>
          }
        </div>
      </div>
    </div>

    <div class="score-panel">
      <p class="score-label">SCORE</p>
      <p class="score-value">{{ Math.floor(score) }}</p>
      <p class="best-value">BEST: {{ Math.floor(highScore) }}</p>
    </div>

    <div class="top-right">
      <div class="coin-badge">🪙 {{ coins }}</div>
      <button class="icon-btn round" (click)="togglePause()">{{ isPaused ? '▶' : '⏸' }}</button>
    </div>

    <div class="speed-panel">
      <p class="speed-label">SPEED</p>
      <div class="speed-bar">
        @for (i of [1,2,3,4,5]; track i) {
          <span class="speed-seg" [class.filled]="i <= speedTier"></span>
        }
      </div>
    </div>

    <div class="distance-wrap">
      <div class="distance-bar">
        <div class="distance-fill" [style.width.%]="distancePercent"></div>
        <span class="flag">🏁</span>
      </div>
      <span class="distance-label">{{ Math.floor(score * 3) }} M</span>
    </div>

    <button class="touch-btn jump-btn" (pointerdown)="pressJump()" (pointerup)="releaseJump()">
      <span>⬆</span><small>JUMP</small>
    </button>
    <button class="touch-btn duck-btn" (pointerdown)="pressDuck()" (pointerup)="releaseDuck()">
      <span>⬇</span><small>SLIDE</small>
    </button>
  </div>
</div>
