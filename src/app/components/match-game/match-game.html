<div class="game-page">
  <div class="canvas-wrap">
    <canvas #gameCanvas width="1100" height="500"></canvas>

    <button class="back-btn" (click)="onExit()"><i class="fa-solid fa-arrow-left"></i></button>

    <div class="top-left-icons">
      <button class="icon-btn round" (click)="language.toggle()"><i class="fa-solid fa-globe"></i></button>
      <button class="icon-btn round" (click)="sound.toggleMute()">
        <i class="fa-solid" [class.fa-volume-high]="!sound.muted" [class.fa-volume-xmark]="sound.muted"></i>
      </button>
    </div>

    <div class="timer-panel">
      <p class="timer-value" [class.danger]="isSuddenDeath">
        {{ isSuddenDeath ? 'SUDDEN DEATH' : displaySecondsLeft + 's' }}
      </p>
      <div class="speed-bar">
        @for (i of [1,2,3,4,5,6,7]; track i) {
          <span class="speed-seg" [class.filled]="i <= speedTier"></span>
        }
      </div>
    </div>

    <button class="standings-toggle" (click)="showStandings = !showStandings">
      <i class="fa-solid fa-trophy"></i>
    </button>

    @if (showStandings) {
      <aside class="standings-panel">
        <p class="standings-title">Standings</p>
        @for (entry of standings; track entry.userId; let i = $index) {
          <div class="standing-row" [class.local]="entry.isLocal" [class.out]="entry.eliminated">
            <span class="standing-rank">{{ i + 1 }}</span>
            <span class="standing-name">{{ entry.username }}{{ entry.isLocal ? ' (you)' : '' }}</span>
            <span class="standing-score">{{ entry.score }}pt</span>
          </div>
        }
      </aside>
    }

    <button class="touch-btn jump-btn" (pointerdown)="pressJump()" (pointerup)="releaseJump()">
      <i class="fa-solid fa-arrow-up"></i><small>JUMP</small>
    </button>
    <button class="touch-btn duck-btn" (pointerdown)="pressDuck()" (pointerup)="releaseDuck()">
      <i class="fa-solid fa-arrow-down"></i><small>SLIDE</small>
    </button>
  </div>
</div>
