<div class="mode-page">
  <a class="back-btn" routerLink="/">←</a>
  <div class="lang-sound-row">
    <button class="icon-btn" (click)="language.toggle()">{{ language.lang() === 'en' ? '🌐 EN' : '🌐 FR' }}</button>
    <button class="icon-btn" (click)="sound.toggleMute()">{{ sound.muted ? '🔇' : '🔊' }}</button>
  </div>

  <h1>🦕 {{ t('heading') }} 🦕</h1>
  <p class="sub">{{ t('sub') }}</p>

  <div class="mode-grid">
    <div class="mode-card solo" (click)="playSolo()">
      <img class="mode-image" src="/solo.avif" alt="Solo mode" />
      <h3>{{ t('solo') }}</h3>
      <p>{{ t('soloDesc') }}</p>
    </div>

    <div class="mode-card multi" (click)="createMatch()">
      <img class="mode-image" src="/multi.avif" alt="Multiplayer mode" />
      <h3>{{ t('multi') }}</h3>
      <p>{{ t('multiDesc') }}</p>
      @if (isConnecting) {
        <p class="status">Connecting...</p>
      }
    </div>
  </div>

  <div class="join-block" (click)="$event.stopPropagation()">
    <input type="text" [placeholder]="t('join')" [(ngModel)]="joinCode" />
    <button class="btn-secondary" (click)="joinMatch()">{{ t('go') }}</button>
  </div>

  @if (connectError) {
    <p class="error-text">{{ connectError }}</p>
  }
</div>
